# tmux reads only the first of ~/.tmux.conf and ~/.config/tmux/tmux.conf that
# exists, so this file would otherwise hide Omarchy's tmux config. Defer to it
# where it exists, and use this repo's config everywhere else.
if-shell '[ -f ~/.config/tmux/tmux.conf ]' \
    'source-file ~/.config/tmux/tmux.conf' \
    'source-file ~/.config/tmux/dotfiles.conf'
