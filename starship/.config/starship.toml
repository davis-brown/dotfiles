"$schema" = 'https://starship.rs/config-schema.json'

# Tokyo Night — https://github.com/enkia/tokyo-night-vscode-theme
# bg_dark=#1a1b26  bg=#24283b  bg_highlight=#414868
# blue=#7aa2f7     cyan=#7dcfff  green=#9ece6a
# yellow=#e0af68   orange=#ff9e64  red=#f7768e  purple=#bb9af7
# fg=#c0caf5       comment=#565f89

format = """
[](fg:#1a1b26)\
$os\
[](bg:#24283b fg:#1a1b26)\
$directory\
[](fg:#24283b bg:#414868)\
$git_branch\
$git_status\
[](fg:#414868 bg:#1d2230)\
$golang\
$nodejs\
$python\
$rust\
$java\
[](fg:#1d2230)\
$fill\
$cmd_duration\
$line_break\
$character"""

[os]
format = "[$symbol](bg:#1a1b26 fg:#7aa2f7 bold) "
disabled = false

[os.symbols]
Ubuntu = ""
Debian = ""
Fedora = ""
Arch = ""
Macos = ""
Windows = ""
Linux = ""

[directory]
format = "[ $path ]($style)"
style = "bg:#24283b fg:#c0caf5"
truncation_length = 3
truncation_symbol = "…/"
read_only = " 󰌾"

[directory.substitutions]
"Documents" = "󰈙"
"Downloads" = ""
"Music" = "󰝚"
"Pictures" = ""
"Developer" = "󰲋"

[git_branch]
format = "[ $symbol$branch ]($style)"
style = "bg:#414868 fg:#7aa2f7"
symbol = " "

[git_status]
format = "[$all_status$ahead_behind ]($style)"
style = "bg:#414868 fg:#f7768e"
conflicted = "!"
ahead = "⇡${count}"
behind = "⇣${count}"
diverged = "⇕⇡${ahead_count}⇣${behind_count}"
untracked = "?"
stashed = "$"
modified = "~"
staged = "+"
renamed = "»"
deleted = "✘"

[golang]
format = "[ $symbol$version ]($style)"
style = "bg:#1d2230 fg:#7dcfff"
symbol = " "

[nodejs]
format = "[ $symbol$version ]($style)"
style = "bg:#1d2230 fg:#9ece6a"
symbol = " "

[python]
format = "[ $symbol$version ]($style)"
style = "bg:#1d2230 fg:#e0af68"
symbol = " "

[rust]
format = "[ $symbol$version ]($style)"
style = "bg:#1d2230 fg:#ff9e64"
symbol = " "

[java]
format = "[ $symbol$version ]($style)"
style = "bg:#1d2230 fg:#f7768e"
symbol = " "

[fill]
symbol = " "

[cmd_duration]
format = "[$duration](fg:#565f89) "
min_time = 2_000

[character]
success_symbol = "[❯](fg:#9ece6a)"
error_symbol = "[❯](fg:#f7768e)"
vimcmd_symbol = "[❮](fg:#bb9af7)"
