name: shellcheck

on:
  push:
  pull_request:

jobs:
  shellcheck:
    # shellcheck is preinstalled on GitHub's Ubuntu runners.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Lint shell scripts
        run: shellcheck --severity=warning install_dev_tools.sh

      # The shared shell config is sourced by both bash and zsh, so it is
      # checked as POSIX sh rather than bash.
      - name: Lint shared shell config
        run: shellcheck --severity=warning --shell=sh .config/shell/env.sh .config/shell/interactive.sh

      - name: Lint bashrc
        run: shellcheck --severity=warning --shell=bash .bashrc
