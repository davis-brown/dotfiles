# Tokyo Night, to match starship.toml
# bg_dark=#1a1b26  bg=#24283b  bg_highlight=#414868
# blue=#7aa2f7     cyan=#7dcfff  green=#9ece6a
# yellow=#e0af68   red=#f7768e   purple=#bb9af7
# fg=#c0caf5       comment=#565f89

# Ctrl-a is easier to reach than Ctrl-b and doesn't fight readline's Ctrl-b.
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# True color. The terminal-overrides entry is what actually enables RGB;
# without it tmux downsamples to 256 colors and the theme looks muddy.
set -g default-terminal "tmux-256color"
set -ga terminal-overrides ",*256col*:Tc,xterm-256color:Tc,alacritty:Tc"

set -g mouse on
set -g history-limit 50000
set -s escape-time 10          # don't swallow Esc; matters in vim/nvim
set -g focus-events on         # so nvim's autoread works
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g set-titles on
set -g set-titles-string "#S:#W"
set -g display-time 2000

# Splits that keep the current directory, with mnemonic keys.
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"
unbind '"'
unbind %

# Match the .vimrc/nvim window navigation.
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

bind r source-file ~/.config/tmux/dotfiles.conf \; display "reloaded"

# vi copy mode, piping to the system clipboard via xclip.
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "xclip -selection clipboard -i"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "xclip -selection clipboard -i"

# Status bar
set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#1a1b26,fg=#c0caf5"
set -g status-left-length 30
set -g status-right-length 60
set -g status-left "#[bg=#7aa2f7,fg=#1a1b26,bold] #S #[bg=#1a1b26,fg=#7aa2f7]"
set -g status-right "#[fg=#565f89]#{?client_prefix,#[fg=#e0af68]^A ,}#[fg=#565f89]%Y-%m-%d %H:%M "
setw -g window-status-format "#[fg=#565f89] #I:#W "
setw -g window-status-current-format "#[bg=#414868,fg=#7dcfff,bold] #I:#W "
set -g pane-border-style "fg=#414868"
set -g pane-active-border-style "fg=#7aa2f7"
set -g message-style "bg=#414868,fg=#c0caf5"

# Machine-specific tmux config that should not be committed.
if-shell "[ -f ~/.tmux.conf.local ]" "source-file ~/.tmux.conf.local"
